<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <th:block th:replace="~{fragments/head :: htmx}"></th:block>
</head>
<body>
<h1>Gestión de usuarios</h1>
<a th:href="@{/admin/panel}">Volver al panel</a>

<div id="contenido" hx-target="#contenido">
    <div th:fragment="lista">
        <p th:if="${error}" th:text="${error}" style="color:red"></p>

        <button th:hx-get="@{/admin/usuarios/nuevo}">Nuevo usuario</button>

        <table border="1">
            <thead>
            <tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Carrera</th><th>Activo</th><th>Acciones</th></tr>
            </thead>
            <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.nombre}"></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.rol}"></td>
                <td th:text="${u.carrera != null} ? ${u.carrera.nombre} : '—'"></td>
                <td th:text="${u.activo} ? 'Sí' : 'No'"></td>
                <td>
                    <button th:hx-get="@{/admin/usuarios/{id}/editar(id=${u.id})}">Editar</button>
                    <button th:hx-delete="@{/admin/usuarios/{id}(id=${u.id})}"
                            hx-confirm="¿Eliminar este usuario?">Eliminar</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
